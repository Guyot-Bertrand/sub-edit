name: Bug
description: Incorrect behaviour that can be reproduced
labels: ["type:bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
      description: What happens, as observed.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should happen, and why.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: >
        The minimal steps to reproduce. A subtitle file reduced to the
        problematic case is better than a long description.
      placeholder: |
        1. subedit-cli convert example.srt --format microdvd
        2. …
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `subedit-cli --version`, or git revision.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Distribution, Qt version, any relevant detail.
