name: Task
description: Technical work with no direct effect for the user
labels: ["type:task"]
body:
  - type: textarea
    id: work
    attributes:
      label: Work to do
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why now
      description: >
        What makes this work necessary, and what it unblocks. A task with no
        identified consequence is a task not to do.
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Completion criteria
      placeholder: |
        - [ ] …
    validations:
      required: true
