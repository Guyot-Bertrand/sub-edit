name: End-of-phase review
description: Check that a phase holds, before closing it
title: "End-of-phase review "
labels: ["type:task", "area:doc", "prio:high"]
body:
  - type: markdown
    attributes:
      value: >
        **The third of the three issues that frame a phase**, after the
        initialisation and the scoping. It opens when the last implementation
        issue is merged, and closes before the milestone.


        It produces no feature: it checks that the phase holds. The blocks
        below arrive pre-filled with what holds for every phase — editing them
        is expected, leaving them as they are is not.

  - type: input
    id: framing
    attributes:
      label: The issues that frame the phase
      description: >
        The initialisation and the scoping, by number — those that existed.
        They say what the phase promised itself, and it is against them that
        what was delivered is confronted.
      placeholder: "#161 (initialisation), #165 (scoping)"
    validations:
      required: true

  - type: textarea
    id: axes
    attributes:
      label: What it does
      description: >
        The four axes hold for every phase. Refine them with what is
        particular to this one.
      value: |
        - **Confront the spec with what was delivered.** A gap is either fixed
          or recorded; an unrecorded gap is a forgotten gap. Look first at the
          places where the spec moved along the way.
        - **Pass on the deferrals.** Every "later" must land on a named phase
          or issue.
        - **Re-read the manual in one go.** *Keep the line that holds for this
          phase.* For `subedit-gui`: prose that nothing holds — decision of
          #116 — so this review is the only guarantee it has. For
          `subedit-cli`: `manual-check` holds the examples, not the sentences
          around them; those are what gets re-read.
        - **Re-read the ADRs the phase produced.** Do they still say what was
          built? A decision whose cost showed up afterwards is re-examined
          here, or nowhere.
        - **Confront the measurements with the earlier ones.** The performance
          log and the coverage ratchet: what moved during the phase, and
          whether the written justification still holds.
        - **A critical look at all the phase's code.** What comes out of it is
          not fixed here: each axis is discussed and becomes an issue if it is
          retained.
    validations:
      required: true

  - type: textarea
    id: deferrals
    attributes:
      label: The phase's deferrals, and where they land
      description: >
        One per line, with its destination. A "later" that names no phase is a
        lost deferral: phase 6 left six behind those two words — six control
        commands recorded nowhere — and only noticed when recounting against
        Gaupol.
      placeholder: |
        - frame-by-frame stepping → phase 14
        - cross-checking two frame-rate sources → phase 16
        - waveform → never, nothing asks for it
    validations:
      required: true

  - type: textarea
    id: attention
    attributes:
      label: Points to look at in particular
      description: >
        **What surprised during the phase**, not a generic list: a decision
        whose cost was measured afterwards, a defect that only use revealed, a
        repetition that was absorbed twice without being read.


        Include, if any, **what was announced as verified without being so**:
        phase 6 declared its player working on structural evidence, and the
        panel stayed empty until a human ran the program. Telling what was
        observed from what was deduced costs one review and is paid once.
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Completion criteria
      description: >
        The first four hold for every phase. Add those the points above call
        for — an open question is closed in writing, not by tacit agreement.
      value: |
        - [ ] The spec and what was delivered agree, or the gap is recorded
        - [ ] Every deferral lands on a named phase or issue
        - [ ] The manual was re-read in one go, by someone discovering it
        - [ ] Every requirement of the phase is `implemented` and cited by a test
        - [ ] The phase's ADRs describe what was built
        - [ ] The axes retained by the review have their issue
    validations:
      required: true
