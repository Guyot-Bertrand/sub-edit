name: Enhancement
description: A change to an existing behaviour
labels: ["type:enhancement"]
body:
  - type: textarea
    id: current
    attributes:
      label: Current situation
      description: What the project does today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed enhancement
      description: What would change, and the expected gain.
    validations:
      required: true

  - type: textarea
    id: measurement
    attributes:
      label: Measurement
      description: >
        If it is about performance: the benchmark that establishes it. No figure
        is announced without a measurement to back it.
