name: Story
description: A feature seen from the user's point of view
labels: ["type:story"]
body:
  - type: textarea
    id: need
    attributes:
      label: Need
      description: >
        Who needs what, and what for. Describe the use, not the solution — the
        design comes after.
      placeholder: >
        As a translator, I want to open a translation file alongside the main
        file, so that I can enter the translation without losing the sync.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What, once verifiable, allows the story to be closed.
      placeholder: |
        - [ ] …
        - [ ] …
    validations:
      required: true

  - type: input
    id: reference
    attributes:
      label: Gaupol reference
      description: >
        The corresponding file or feature in reference/gaupol, if there is one.
        The project aims at feature parity.

  - type: textarea
    id: notes
    attributes:
      label: Points to watch
      description: Anticipated difficulties, decisions to make, dependencies.
