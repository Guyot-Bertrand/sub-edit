name: ci

on:
  # La poussée déclenche la porte sur toute branche, et non sur `main` seule.
  #
  # C'est un contournement, assumé comme tel : sur ce dépôt, l'événement
  # `pull_request` ne crée aucun run. Il est pourtant bien enregistré côté
  # GitHub — `opened`, `synchronize` et `reopened` ont été émis puis vérifiés
  # un par un, et aucune check suite n'apparaît sur la tête de la pull request.
  # Réglages du dépôt, état du workflow et grammaire du fichier ont été
  # écartés ; l'anomalie est signalée au support.
  #
  # Le remplacement couvre les mêmes cas : le projet n'accepte pas de
  # contribution externe, donc toute branche vit ici, et les check runs d'une
  # poussée s'attachent au SHA de tête — celui qu'inspecte la règle
  # `porte de qualité`.
  push:
    branches: ['**']

  # Conservé sans illusion. S'il se remet à fonctionner, il ramène avec lui la
  # vérification du titre de la pull request, que la poussée ne peut pas faire.
  # Le prix serait alors un run en double par poussée sur une branche dont la
  # pull request est ouverte.
  pull_request:

  # Relance manuelle. N'apparaît dans l'interface qu'une fois ce fichier sur la
  # branche par défaut, contrainte de GitHub.
  workflow_dispatch:

# Une nouvelle poussée annule la vérification en cours sur la même référence.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: porte de qualité
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # La CI installe la chaîne d'outils avec le script utilisé en local :
      # une divergence entre les deux environnements deviendrait invisible.
      - name: Chaîne d'outils
        run: ./src/scripts/setup-toolchain.sh

      - name: Cache de compilation
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ github.job }}

      # La CI n'exécute rien d'autre que make check. Recopier ses étapes ici
      # les ferait diverger du filet local dès la première modification.
      - name: make check
        run: make check

      - name: Rapport de couverture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: couverture
          path: build/coverage-report/
          if-no-files-found: ignore

  commits:
    name: messages de commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Grammaire Conventional Commits
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: ./src/scripts/check-commit-range.sh

      - name: Titre de la pull request
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: ./src/scripts/check-commit-message.sh "${PR_TITLE}"
