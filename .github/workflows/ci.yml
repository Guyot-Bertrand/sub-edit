name: ci

# **One run per pull request, not two.** There used to be a `push` trigger on
# `main` here that replayed, after the merge, exactly the tree the pull request
# had just validated: half the Actions quota went on re-checking what had
# already been checked. What it really covered — a pull request merged onto a
# stale base — is taken over by the weekly run below, and is fully closed by
# requiring an up-to-date branch before merge.
#
# **Documentation does not wake the gate.** This is the rule written in
# CLAUDE.md — it is only rerun if it can see the difference — applied here.
# A scoping, manual or ADR pull request therefore triggers nothing. The checks
# that must run on a documentation pull request — message grammar, title,
# "Closes #N", bump, log — live in pull-request.yml, which has no path filter.

# **On demand only, since #232.** The Actions minutes and the cache storage
# went too fast for one run per pull request: the August quota was exhausted on
# 2026-08-27, and the renewal changed nothing. The `pull_request` and
# `schedule` triggers are therefore removed, and `workflow_dispatch` remains so
# that a pull request that deserves it can still be replayed on a neutral
# machine.
#
# **What guards the repository is `make check`, locally.** It is the same
# target; what is lost is the neutrality of the machine that replayed it. What
# now runs on GitHub for each version is `release.yml`, which builds and
# publishes the packages when a tag is pushed.

on:
  # Manual rerun, on any branch. The button only appears in the interface if
  # this file is on the default branch, a GitHub constraint.
  workflow_dispatch:

# A new push cancels the check in progress on the same reference.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: quality gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # The full history. clang-tidy's scope no longer uses it since
          # #269 — it is no longer computed at all —, but two checks of the
          # gate still read git: `check-untracked.sh`, which compares the
          # untracked files before and after, and `check-architecture.sh`,
          # which compares a tag with the declared version. A shallow clone
          # would hinder them.
          fetch-depth: 0

      # The packages are restored installed, not downloaded again: that is the
      # difference between three seconds and nearly five minutes, measured.
      #
      # The list comes from setup-toolchain.sh and is not copied here. A second
      # list would diverge at the first package added, and the cache would
      # restore an incomplete toolchain without anything saying so.
      - name: Toolchain packages
        id: paquets
        run: echo "liste=$(./src/scripts/setup-toolchain.sh --list-packages | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Packages cache
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: ${{ steps.paquets.outputs.liste }}
          version: 1

      # The CI installs the toolchain with the script used locally: a
      # divergence between the two environments would become invisible. The
      # script is idempotent — after the cache, it reinstalls nothing and
      # settles for git-cliff and the hooks.
      - name: Toolchain
        run: ./src/scripts/setup-toolchain.sh

      - name: Compilation cache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ github.job }}

      # The static analysis tree, kept from one run to the next.
      #
      # **It is what carries incrementality since #269.** clang-tidy is hooked
      # onto each source's compile rule, so what decides to re-analyse a file
      # is the build system: the source, a header of its dependency file, or
      # its command line. A fresh runner has an empty tree, and would therefore
      # analyse all 223 files on every run — thirteen minutes a cache makes
      # unnecessary.
      #
      # The key falls back to the base for a pull request, which gives the
      # branch the `main` tree as a starting point. `restore-keys` accepts an
      # older tree rather than none: Ninja will replay what changed since,
      # which is exactly its job.
      #
      # **A stale cache cannot make the analysis wrong**, and that is what
      # allows one to be set: Ninja compares the fingerprints it wrote with
      # the inputs it finds. A tree from elsewhere does at worst too much work,
      # never too little.
      - name: Static analysis cache
        uses: actions/cache@v4
        with:
          path: build/tidy
          key: tidy-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            tidy-${{ runner.os }}-

      # The CI runs nothing but make check. Copying its steps here would make
      # them diverge from the local net at the first change.
      #
      # JOBS is passed explicitly: the default is one core, so as not to starve
      # the other jobs of a development machine. Here the machine is ours
      # alone, and nothing justifies waiting.
      #
      # **No more `TIDY_BASE`.** The analysis scope is no longer computed from
      # a git diff: there is nothing left to tell the CI, and so nothing left
      # to get wrong. A pull request and a weekly run launch exactly the same
      # command — issue #269.
      - name: make check
        run: make check JOBS=$(nproc)

      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: build/coverage-report/
          if-no-files-found: ignore
