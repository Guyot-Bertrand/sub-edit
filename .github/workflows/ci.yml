name: ci

# **Une exécution par pull request, et pas deux.** Il y avait ici un
# déclencheur `push` sur `main` qui rejouait, après la fusion, exactement
# l'arbre que la pull request venait de valider : la moitié du quota d'Actions
# partait à revérifier ce qui l'avait déjà été. Ce qu'il couvrait vraiment —
# une pull request fusionnée sur une base périmée — est repris par
# l'exécution hebdomadaire ci-dessous, et se ferme complètement en exigeant
# une branche à jour avant fusion.
#
# **La documentation ne réveille pas la porte.** C'est la règle écrite dans
# CLAUDE.md — elle ne se relance que si elle peut voir la différence —
# appliquée ici. Une pull request de cadrage, de manuel ou d'ADR ne déclenche
# donc rien. Les contrôles qui, eux, doivent tourner sur une pull request de
# documentation — grammaire des messages, titre, « Closes #N », bump, journal —
# vivent dans pull-request.yml, qui n'a pas de filtre de chemins.

# ==== SUSPENDU LE 2026-08-27 — quota d'Actions épuisé =======================
#
# Les 2000 minutes du mois sont consommées. **La porte n'est pas supprimée,
# elle est débranchée :** les deux déclencheurs automatiques sont commentés
# ci-dessous et `workflow_dispatch` reste, de sorte qu'une exécution à la
# demande est toujours possible si une pull request la mérite.
#
# **Ce qui garde le dépôt entre-temps est `make check`, en local.** C'est la
# même cible — la CI ne faisait que la rejouer sur une machine neutre. Ce
# qu'on perd est précisément cette neutralité : la porte ne tourne plus que
# là où le code s'écrit, donc « je l'ai lancée » n'est plus vérifiable par
# personne d'autre. La règle du projet, ne jamais annoncer un travail terminé
# sans l'avoir lancée, devient la seule garde.
#
# **Le ruleset « porte de qualité » est passé à `disabled` en même temps.** Il
# exigeait le check du job ci-dessous, qui ne serait plus jamais rapporté :
# chaque pull request aurait affiché une attente éternelle, contournée à la
# main par la dérogation admin. Voir docs/configuration-github.md.
#
# **À rétablir le 2026-09-01**, quand le quota se renouvelle. Deux gestes :
# décommenter les deux déclencheurs ci-dessous, et rendre son application au
# ruleset — la commande est dans docs/configuration-github.md.
#
# ============================================================================

on:
  # pull_request:
  #   paths-ignore:
  #     - 'docs/**'
  #     - 'CHANGELOG.md'
  #     - 'CLAUDE.md'
  #     - 'CONTRIBUTING.md'
  #     - 'README.md'
  #     - 'cliff.toml'
  #     - 'LICENSE'

  # Le filet de l'analyse complète, une fois par semaine sur main : la porte
  # d'une pull request n'analyse plus que ce qu'elle met en cause, et ce qui
  # échappe à ce calcul — un drapeau changé dans un CMakeLists imbriqué — se
  # verrait ici. Lundi, à une heure où personne n'attend le résultat.
  # schedule:
  #   - cron: '0 4 * * 1'

  # Relance manuelle, sur n'importe quelle branche. Utile quand un run se perd
  # sans que le dépôt y soit pour quelque chose — une panne d'Actions, par
  # exemple — et qu'il faut reproduire le check sans commit vide. Le bouton
  # n'apparaît dans l'interface que si ce fichier est sur la branche par
  # défaut, contrainte de GitHub.
  workflow_dispatch:

# Une nouvelle poussée annule la vérification en cours sur la même référence.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: porte de qualité
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # L'historique complet. Le périmètre de clang-tidy ne s'en sert plus
          # depuis #269 — il ne se calcule plus du tout —, mais deux contrôles
          # de la porte lisent encore git : `check-untracked.sh`, qui confronte
          # les fichiers non suivis avant et après, et `check-architecture.sh`,
          # qui confronte un tag à la version déclarée. Un clone superficiel
          # les gênerait.
          fetch-depth: 0

      # Les paquets sont restaurés installés, pas retéléchargés : c'est la
      # différence entre trois secondes et près de cinq minutes, mesurées.
      #
      # La liste vient de setup-toolchain.sh et n'est pas recopiée ici. Une
      # seconde liste divergerait au premier paquet ajouté, et le cache
      # restaurerait une chaîne d'outils incomplète sans que rien ne le dise.
      - name: Paquets de la chaîne d'outils
        id: paquets
        run: echo "liste=$(./src/scripts/setup-toolchain.sh --list-packages | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Cache des paquets
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: ${{ steps.paquets.outputs.liste }}
          version: 1

      # La CI installe la chaîne d'outils avec le script utilisé en local :
      # une divergence entre les deux environnements deviendrait invisible. Le
      # script est idempotent — après le cache, il ne réinstalle rien et se
      # contente de git-cliff et des hooks.
      - name: Chaîne d'outils
        run: ./src/scripts/setup-toolchain.sh

      - name: Cache de compilation
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ github.job }}

      # L'arbre de l'analyse statique, gardé d'une exécution à l'autre.
      #
      # **C'est lui qui porte l'incrémentalité depuis #269.** clang-tidy est
      # accroché à la règle de compilation de chaque source, donc ce qui décide
      # de réanalyser un fichier est le système de construction : la source, un
      # en-tête de son fichier de dépendances, ou sa ligne de commande. Un
      # coureur neuf a un arbre vide, et analyserait donc les 223 fichiers à
      # chaque exécution — treize minutes qu'un cache rend inutiles.
      #
      # La clé retombe sur la base pour une pull request, ce qui donne à la
      # branche l'arbre de `main` comme point de départ. `restore-keys` accepte
      # un arbre plus ancien plutôt que rien : Ninja rejouera ce qui a changé
      # depuis, ce qui est exactement son travail.
      #
      # **Un cache périmé ne peut pas rendre l'analyse fausse**, et c'est ce qui
      # autorise à en poser un : Ninja compare les empreintes qu'il a écrites
      # aux entrées qu'il trouve. Un arbre venu d'ailleurs fait au pire trop de
      # travail, jamais trop peu.
      - name: Cache de l'analyse statique
        uses: actions/cache@v4
        with:
          path: build/tidy
          key: tidy-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            tidy-${{ runner.os }}-

      # La CI n'exécute rien d'autre que make check. Recopier ses étapes ici
      # les ferait diverger du filet local dès la première modification.
      #
      # JOBS est passé explicitement : la valeur par défaut est de un cœur, pour
      # ne pas affamer les autres travaux d'une machine de développement. Ici la
      # machine est à nous seuls, et rien ne justifie d'attendre.
      #
      # **Plus de `TIDY_BASE`.** Le périmètre de l'analyse ne se calcule plus
      # depuis un diff git : il n'y a plus rien à dire à la CI, et donc plus
      # rien où se tromper. Une pull request et une exécution hebdomadaire
      # lancent exactement la même commande — issue #269.
      - name: make check
        run: make check JOBS=$(nproc)

      - name: Rapport de couverture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: couverture
          path: build/coverage-report/
          if-no-files-found: ignore
