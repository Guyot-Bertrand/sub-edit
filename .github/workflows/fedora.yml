name: fedora

# Le `.rpm`, installé sur une vraie Fedora — issue #266.
#
# **Ce que ce workflow apporte et que rien d'autre n'a.** Le développement se
# fait sur Ubuntu : `rpmbuild` y produit un `.rpm` et `rpm` n'y installe rien.
# Trois lignes du tableau de l'ADR 0023 restaient donc vides, dont la plus
# coûteuse — que les noms de dépendances existent chez Fedora. Ils sont écrits à
# la main dans `cmake/Packaging.cmake`, CPack ne sachant rien de Fedora, et un
# nom erroné produit un paquet parfaitement valide qui refuse de s'installer.
#
# Le premier passage a trouvé un défaut, et ce n'étaient pas les dépendances :
# le paquet revendiquait huit répertoires de la distribution, et `dnf` refusait
# la transaction. Voir `src/scripts/check-rpm.sh`.
#
# **Hebdomadaire, et pas par pull request.** Le quota d'Actions du dépôt a déjà
# été épuisé une fois (#232, #233) ; un conteneur qui télécharge Qt à chaque
# pull request n'est pas gratuit, et ce qu'il éprouve ne bouge qu'avec
# l'empaquetage. Ce qui garde les pull requests entre-temps est local et
# gratuit : `check-installation.sh` refuse un `.rpm` qui possède un répertoire
# qui n'est pas à lui, c'est-à-dire la cause du défaut ci-dessus.
#
# La règle elle-même n'est pas ici mais dans `src/scripts/check-rpm.sh` : un
# script se lance en local, un bloc de YAML non. C'est la même raison qui a
# sorti la sélection de l'élagueur de `elagage.yml`.

on:
  # Mardi, pour ne pas se mettre en travers du lundi — l'analyse complète de
  # `ci.yml` à 4 h et l'élagueur à 6 h. Rien ici n'a de raison d'être le même
  # jour qu'eux, et deux tâches longues sur le même créneau font attendre pour
  # rien.
  schedule:
    - cron: '0 4 * * 2'

  # Le bouton, pour le jour où l'empaquetage change : c'est le seul moment où
  # attendre mardi n'a pas de sens. Il n'apparaît dans l'interface que si ce
  # fichier est sur la branche par défaut, contrainte de GitHub.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpm:
    name: le .rpm sur Fedora
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # La chaîne d'outils complète, et non un sous-ensemble : `check-rpm.sh`
      # a besoin du `.rpm`, donc de `cpack` et de `rpmbuild`, donc de tout ce
      # qui construit les binaires. La liste vient de setup-toolchain.sh et
      # n'est pas recopiée ici — une seconde liste divergerait au premier
      # paquet ajouté.
      - name: Paquets de la chaîne d'outils
        id: paquets
        run: echo "liste=$(./src/scripts/setup-toolchain.sh --list-packages | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Cache des paquets
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: ${{ steps.paquets.outputs.liste }}
          version: 1

      - name: Chaîne d'outils
        run: ./src/scripts/setup-toolchain.sh

      - name: Cache de compilation
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ github.job }}

      # Docker est présent d'origine sur les coureurs GitHub ; le script prend
      # podman s'il le trouve d'abord, ce qu'une Fedora a. Rien à installer.
      - name: make rpm-check
        run: make rpm-check JOBS=$(nproc)
