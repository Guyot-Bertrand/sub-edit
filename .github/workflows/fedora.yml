name: fedora

# The `.rpm`, installed on a real Fedora — issue #266.
#
# **What this workflow brings that nothing else has.** Development happens on
# Ubuntu: `rpmbuild` produces an `.rpm` there and `rpm` installs nothing.
# Three rows of the ADR 0023 table therefore stayed empty, including the most
# costly one — that the dependency names exist at Fedora. They are written by
# hand in `cmake/Packaging.cmake`, CPack knowing nothing about Fedora, and a
# wrong name produces a perfectly valid package that refuses to install.
#
# The first run found a defect, and it was not the dependencies: the package
# claimed eight directories of the distribution, and `dnf` refused the
# transaction. See `src/scripts/check-rpm.sh`.
#
# **Weekly, and not per pull request.** The repository's Actions quota has
# already been exhausted once (#232, #233); a container that downloads Qt on
# every pull request is not free, and what it exercises only moves with the
# packaging. What guards pull requests in the meantime is local and free:
# `check-installation.sh` refuses an `.rpm` that owns a directory that is not
# its own, that is, the cause of the defect above.
#
# The rule itself is not here but in `src/scripts/check-rpm.sh`: a script can
# be run locally, a block of YAML cannot. It is the same reason that took the
# pruner's selection out of `elagage.yml`.

on:
  # Tuesday, so as not to get in the way of Monday — the full analysis of
  # `ci.yml` at 4:00 and the pruner at 6:00. Nothing here has a reason to be on
  # the same day as them, and two long jobs on the same slot make things wait
  # for nothing.
  schedule:
    - cron: '0 4 * * 2'

  # The button, for the day the packaging changes: it is the only moment when
  # waiting for Tuesday makes no sense. It only appears in the interface if this
  # file is on the default branch, a GitHub constraint.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpm:
    name: the .rpm on Fedora
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The full toolchain, not a subset: `check-rpm.sh` needs the `.rpm`, so
      # `cpack` and `rpmbuild`, so everything that builds the binaries. The list
      # comes from setup-toolchain.sh and is not copied here — a second list
      # would diverge at the first package added.
      - name: Toolchain packages
        id: paquets
        run: echo "liste=$(./src/scripts/setup-toolchain.sh --list-packages | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Packages cache
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: ${{ steps.paquets.outputs.liste }}
          version: 1

      - name: Toolchain
        run: ./src/scripts/setup-toolchain.sh

      - name: Compilation cache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ github.job }}

      # Docker is present out of the box on GitHub runners; the script takes
      # podman if it finds it first, which a Fedora has. Nothing to install.
      - name: make rpm-check
        run: make rpm-check JOBS=$(nproc)
