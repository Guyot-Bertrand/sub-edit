name: pull request

# The three obligations the quality gate does not see: the "Closes #N" line in
# the body, the patch bump and the regeneration of the log. They are
# mechanically decidable and were done by hand until now.
#
# A file separate from ci.yml because of the "edited" type: a pull request's
# body is often corrected, and adding that type to the common trigger would
# rerun the quality gate — a quarter of an hour of compilation — on every
# touch-up. This job builds nothing and takes a few seconds.
#
# "edited" is indispensable: without it, correcting a forgotten body would
# rerun nothing and the check would stay red. "synchronize" is just as much so,
# for the version and the log to be reviewed on every push.

# **On demand only, since #232**, and for the reason given in `ci.yml`. It
# costs only a minute; it is the gesture that is consistent, not the saving.
# The three obligations it checks — "Closes #N", the patch bump, the
# regenerated log — are rules written in CLAUDE.md, held by hand.
#
# `workflow_dispatch` remains so that the file stays a valid workflow. It is of
# little use: the checks read the body and the base of the pull request that
# triggers them, and a manual run has none.

on:
  workflow_dispatch:

# A new push, or a new edit, cancels the check in progress on the same pull
# request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request:
    name: pull request checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # The branch head, and not the merge commit GitHub builds by
          # default. Regenerating the log on the merge would pull in the
          # commits that arrived on main since the opening, hence a log
          # different from the one the author committed — and the refusal of a
          # correct pull request.
          ref: ${{ github.event.pull_request.head.sha }}
          # git-cliff needs the full history and the tags, and the version
          # check must be able to read CMakeLists.txt on the base.
          fetch-depth: 0

      # Not all of setup-toolchain.sh: this job compiles nothing, and
      # installing cmake, clang-tidy and gcovr would cost it several minutes
      # for three text comparisons.
      - name: git-cliff
        run: ./src/scripts/setup-toolchain.sh --git-cliff-only

      # The three checks live in a script, not in this file: a script can be
      # tested locally, and src/scripts/verify-gates.sh proves that each one
      # closes on the defect it exists to catch.
      - name: Pull request checks
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./src/scripts/check-pull-request.sh

  # This job lived in ci.yml, and it came down from there for two reasons.
  #
  # **It was deaf to corrections there.** ci.yml does not listen to "edited": a
  # corrected pull request title never reran its own check, which stayed red
  # indefinitely. It happened on #99. Here, "edited" is in the trigger,
  # precisely because a body and a title get corrected.
  #
  # **It would have been skipped there.** ci.yml now ignores pull requests that
  # only touch documentation — and a documentation pull request needs a valid
  # title exactly as much as the others.
  commits:
    name: commit messages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Conventional Commits grammar
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./src/scripts/check-commit-range.sh

      - name: Pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: ./src/scripts/check-commit-message.sh "${PR_TITLE}"
