name: release

# The packages of a version, built and published when its tag is pushed —
# issue #232.
#
# **This workflow replaces the gate in CI, it does not complete it.** The
# Actions minutes and the cache storage went too fast for a `make check` run
# per pull request: the gate is local, and it was passed before the merge. What
# remains to be done on a neutral machine is what a development machine cannot
# give — packages built from a clean clone, and a page to download them from.
#
# **One tag per version, patches included**, placed on the merge commit in
# `main`. See the "Versions" section of CLAUDE.md.
#
# **No cache**, neither of apt packages nor of compilation: it is the storage
# item that cost. Every run compiles cold, and that is the accepted price of
# one run per version rather than per push.
#
# **No Actions artefact**: the packages go straight into the release, whose
# files do not count against Actions storage.
#
# The logic lives in two scripts, for the reason given in `elagage.yml` — a
# script can be run locally, a block of YAML cannot: `check-release-tag.sh`
# decides whether the tag deserves a release, `prune-releases.sh` decides
# which ones go.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

  # Replay the publication of a tag already pushed: a run lost for a reason
  # foreign to the repository, or a package to rebuild. The files of an
  # existing release are replaced, not duplicated. The button only appears in
  # the interface if this file is on the default branch.
  #
  # **An on-demand rebuild republishes the package and does not prune.**
  # Without that, rebuilding a patch of a closed milestone — `v0.9.3` while
  # `v0.10.0` exists — would recreate the release, then the pruning step would
  # delete it in the same job. The guard is in `prune-releases.sh`, which reads
  # `GITHUB_EVENT_NAME`.
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to publish, vX.Y.Z'
        required: true

# Write a release, and delete some. Nothing else.
permissions:
  contents: write

# Two publications of the same tag do not step on each other; the second waits
# rather than cancelling a half-done build.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: packages and release
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # Before the checkout, because the name serves as `ref:`: a manual input
      # that is not a version tag never reaches git. Read through the
      # environment and never interpolated into the script.
      - name: The name is that of a version
        run: |
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
              || { echo "“${TAG}” is not written vX.Y.Z" >&2; exit 1; }

      # The full history: `check-release-tag.sh` verifies that the commit is on
      # `main`, and git-cliff writes the notes from the previous tag.
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      # Before the toolchain, and that is the whole point: a tag that does not
      # agree with its version is refused in a few seconds, not after twenty
      # minutes of compilation.
      - name: The tag designates a version of main
        run: ./src/scripts/check-release-tag.sh "${TAG}"

      # The development machine's script, so that the machine that builds the
      # packages does not diverge from the one that tests them.
      - name: Toolchain
        run: ./src/scripts/setup-toolchain.sh

      - name: make packages
        run: make packages JOBS=$(nproc)

      # This version's section of the log, written by the same tool as
      # CHANGELOG.md: `--current` bounds it to the tag pointing at HEAD.
      - name: Release notes
        run: git-cliff --current --strip header --output "${RUNNER_TEMP}/notes.md"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s failglob
          # The `.deb` alone: the `.rpm` built here is built against Ubuntu's ICU,
          # and would install on no Fedora. The ones that get published are built
          # by the `rpm` job, one per Fedora.
          paquets=(build/release/subedit*.deb)
          if gh release view "${TAG}" >/dev/null 2>&1; then
              gh release upload "${TAG}" "${paquets[@]}" --clobber
              gh release edit "${TAG}" --notes-file "${RUNNER_TEMP}/notes.md"
          else
              gh release create "${TAG}" "${paquets[@]}" --verify-tag \
                  --title "subedit ${TAG#v}" --notes-file "${RUNNER_TEMP}/notes.md"
          fi

      # After the publication, and in the same job: a pushed tag is the only
      # moment when the current milestone can change. Under
      # `workflow_dispatch`, the script notices it in `GITHUB_EVENT_NAME`, which
      # Actions sets by itself, and exits without deleting anything. A refused
      # deletion makes it exit with an error: this job goes red.
      - name: Prune the patch releases of past milestones
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./src/scripts/prune-releases.sh

  # The `.rpm`, built **on every published Fedora**, against its ICU.
  #
  # ICU's symbols carry its major version number: an `.rpm` made on Ubuntu
  # (ICU 74) asks for `libicuuc.so.74`, which a recent Fedora does not have and
  # does not offer. The package is therefore not portable from one Fedora to
  # another, and the file name says so: `subedit-X.Y.Z-1.fc43.x86_64.rpm`.
  #
  # After the `release` job, which creates the release: this one only adds its
  # file to it. A Fedora that fails does not stop the others.
  rpm:
    name: rpm fedora ${{ matrix.fedora }}
    needs: release
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        fedora: ['42', '43', '44']
    container: fedora:${{ matrix.fedora }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: git and gh
        run: dnf install -y git gh

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: The .rpm
        run: JOBS=$(nproc) ./src/scripts/build-rpm.sh

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          gh release upload "${TAG}" build/release/subedit*.rpm --clobber
