name: pruning

# Actions runs were piling up without anything deleting them: 146 in ten days
# at the time of writing, 47 of them inherited from the `push` trigger on
# `main` removed in #106. GitHub can set a retention duration, not a count —
# and its duration only deletes the logs and artefacts, leaving the run line in
# the list. They must therefore be deleted, one by one, through the API.
#
# **A workflow, and not a script run by hand.** This is the technical point
# that decides the form, and it was verified: a personal token gets
# `403 Resource not accessible by personal access token` on Actions. Only a
# workflow's `GITHUB_TOKEN` can delete a run, and only if
# `permissions: actions: write` grants it.
#
# The rule itself is not here but in `src/scripts/prune-runs.sh`: a script can
# be tested locally, a block of YAML cannot. `verify-gates.sh` proves that its
# selection handles the five cases that decide it, on a hand-written list
# rather than against GitHub — a proof that depended on the network would be
# red on an outage day, for a reason foreign to the repository.

on:
  # Monday, **two hours after** the full analysis of `ci.yml` (`0 4 * * 1`,
  # which takes a quarter of an hour). The order matters: the pruner spares the
  # most recent run on `main`, so the week's one must already exist when it
  # looks, otherwise it would spare the previous one and the new one would take
  # its place with nobody gaining anything.
  schedule:
    - cron: '0 6 * * 1'

  # The first cleaning went through it, the backlog one: the 146 accumulated
  # runs would not catch themselves up. The button only appears in the
  # interface if this file is on the default branch, a GitHub constraint.
  workflow_dispatch:

# The bare minimum. `actions: write` is what nothing works without;
# `contents: read` serves the checkout, which is only there to read the script.
permissions:
  actions: write
  contents: read

jobs:
  elagage:
    name: prune the runs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # No setup-toolchain.sh: this job compiles nothing, and the two tools the
      # script needs — gh and jq — are preinstalled on GitHub's machines.
      # Installing the full toolchain would cost several minutes for a few API
      # calls.
      - name: Prune
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./src/scripts/prune-runs.sh
