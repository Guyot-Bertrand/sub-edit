# git-cliff configuration — generation of CHANGELOG.md.
#
# The grouping comes from the commit types: that is the return on investment
# of Conventional Commits. No entry can be forgotten, since none is typed by
# hand.

[changelog]
header = """
# Changelog

Notable changes to subedit. Format inspired by
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/), versions following
[SemVer](https://semver.org/).

This file is generated by `make changelog` from the commit history:
do not edit it by hand.

"""

body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}** — {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""

footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
topo_order = false
sort_commits = "oldest"

commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    # Regenerating the log has nothing to say in the log. The rule precedes
    # the `docs` one: the first pattern that matches wins.
    { message = "^docs(?:\\(\\w+\\))?: (?:r\\x{e9}g\\x{e9}n\\x{e9}rer|regenerate) (?:le|the) changelog", skip = true },
    { message = "^docs", group = "Documentation" },
    { message = "^test", group = "Tests" },
    { message = "^build", group = "Build" },
    { message = "^ci", group = "Continuous integration" },
    # Maintenance noise has no place in a log meant for users: it stays in
    # the git history, where it can be consulted.
    { message = "^chore", skip = true },
    { message = "^revert", group = "Reverts" },
]

commit_preprocessors = [
    # Makes issue numbers clickable from the log.
    { pattern = '\\(#(\\d+)\\)', replace = "([#${1}](https://github.com/Guyot-Bertrand/sub-edit/issues/${1}))" },
]
