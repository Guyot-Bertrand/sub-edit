<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    The subedit icon.

    **The comment is here, after the root tag, and it must stay here.**
    gdk-pixbuf — the loader through which GTK desktops read an icon —
    recognises an SVG by looking for "<svg" in the **first 256 bytes** of the
    file. A comment placed before the root pushes the tag beyond that, and the
    file is then recognised by nobody: the desktop shows an empty tile. That is
    what happened — issue #260 — and nothing said so, because Inkscape and Qt
    read the file without caring about that window. `check-icon.py` now checks
    it.

    What it draws: a solid tile, and two subtitle lines, the second shorter.
    The solid tile is what makes it visible on a dark background — the
    previous version was a dark frame on a transparent background, hence
    invisible on a dark desktop, which was the other half of the defect.

    No text: the directory is "scalable/apps", a single image serves all
    sizes, and a glyph would depend on a font the machine may not have.
  -->
  <rect x="2" y="6" width="60" height="52" rx="12" fill="#3d7ad6"/>
  <rect x="12" y="23" width="40" height="9" rx="4.5" fill="#ffffff"/>
  <rect x="12" y="38" width="25" height="9" rx="4.5" fill="#ffffff"/>
</svg>
